id: Command Zero - Test
version: -1
name: Command Zero - Test
description: |-
  Certification test playbook for the Command Zero integration.

  Verifies API key authentication, endpoint reachability, and response parsing
  against a live tenant without creating an investigation or executing any
  response action, so the test is safe to run repeatedly in CI.

  Organizations are asserted to be non-empty, since a valid Application-role API
  key always belongs to at least one organization. The list commands are run as
  smoke tests: they fail the playbook if the request errors or the response
  cannot be parsed.
