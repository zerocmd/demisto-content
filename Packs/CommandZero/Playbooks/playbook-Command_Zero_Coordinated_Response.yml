    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "8":
    id: "8"
    taskid: 4e5f6a70-0000-4000-a000-000000000008
    type: regular
    task:
      id: 4e5f6a70-0000-4000-a000-000000000008
      version: -1
      name: Post verdict only
      description: |-
        The verdict did not qualify for containment. The note records the
        verdict and states explicitly that no response action was requested.
      script: CommandZero|||cmdzero-investigation-note
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "9"
    scriptarguments:
      investigation_id:
        complex:
          root: CommandZero.Investigation
          accessor: id
      response_disposition:
        simple: not-qualifying
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 690,
          "y": 720
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "9":
    id: "9"
    taskid: 4e5f6a70-0000-4000-a000-000000000009
    type: title
    task:
      id: 4e5f6a70-0000-4000-a000-000000000009
      version: -1
      name: Done
      type: title
      iscommand: false
      brand: ""
      description: ''
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 1770
        }
      }
    note: false
    timertriggers: []
