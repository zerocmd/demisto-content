          accessor: id
      response_action_outcome:
        complex:
          root: CommandZero.Remediation
          accessor: governanceOutcome
      response_action_type:
        complex:
          root: CommandZero.Remediation
          accessor: templateName
      response_action_id:
        complex:
          root: CommandZero.Remediation
          accessor: id
      response_action_status:
        complex:
          root: CommandZero.Remediation
          accessor: status
      response_action_reason:
        complex:
          root: CommandZero.Remediation
          accessor: governanceReason
      rollback_template_id:
        complex:
          root: CommandZero.Remediation
          accessor: undoTemplateId
      third_party_actions:
        complex:
          root: ThirdPartyActions
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 240,
          "y": 1595
        }
