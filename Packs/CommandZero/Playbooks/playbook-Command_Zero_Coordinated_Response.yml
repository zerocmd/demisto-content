    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "7":
    id: "7"
    taskid: 4e5f6a70-0000-4000-a000-000000000007
    type: regular
    task:
      id: 4e5f6a70-0000-4000-a000-000000000007
      version: -1
      name: Post combined containment summary
      description: |-
        Writes one War Room note covering the verdict, the Command Zero action,
