id: Command Zero - Investigate Alert
version: -1
name: Command Zero - Investigate Alert
description: |-
  Submits an alert to Command Zero for automated investigation, waits for the
  verdict, and writes the full investigation summary to the War Room as a note.

  No response action is requested by this playbook, and no
  incident, alert, or investigation fields are modified. Use
  "Command Zero - Investigate and Respond" when a native response action should
  follow a qualifying verdict.
starttaskid: "0"
tasks:
  "0":
    id: "0"
    taskid: 6f1a0c80-0000-4000-a000-000000000000
    type: start
    task:
      id: 6f1a0c80-0000-4000-a000-000000000000
      version: -1
      name: ""
      iscommand: false
      brand: ""
      description: ''
    nexttasks:
      '#none#':
        - "1"
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 50
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "1":
    id: "1"
    taskid: 6f1a0c80-0000-4000-a000-000000000001
    type: regular
    task:
      id: 6f1a0c80-0000-4000-a000-000000000001
      version: -1
      name: Submit alert for investigation
      description: |-
        Creates a Command Zero investigation from the supplied alert data.
        Command Zero may merge the alert into an existing investigation; the
        action output records which happened.
      script: CommandZero|||cmdzero-investigation-create
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "2"
    scriptarguments:
      alert_data:
        complex:
          root: inputs.AlertData
      alert_schema:
        complex:
          root: inputs.AlertSchema
      alert_type:
        complex:
          root: inputs.AlertType
      description:
        complex:
          root: inputs.Description
      template_id:
        complex:
          root: inputs.TemplateId
      leads:
        complex:
          root: inputs.Leads
      title:
        complex:
          root: inputs.Title
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 195
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "2":
    id: "2"
    taskid: 6f1a0c80-0000-4000-a000-000000000002
    type: regular
    task:
      id: 6f1a0c80-0000-4000-a000-000000000002
      version: -1
      name: Wait for verdict
      description: |-
        Polls Command Zero until the investigation reaches a verdict. The note
        is posted later, once any existing Command Zero actions on this
        investigation have been looked up.
      script: CommandZero|||cmdzero-investigation-results
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "4"
    scriptarguments:
      investigation_id:
        complex:
          root: CommandZero.Investigation
          accessor: id
      interval_in_seconds:
        complex:
          root: inputs.PollingInterval
      timeout_in_seconds:
        complex:
          root: inputs.PollingTimeout
      post_note:
        simple: "false"
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 370
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "4":
    id: "4"
    taskid: 6f1a0c80-0000-4000-a000-000000000004
    type: regular
    task:
      id: 6f1a0c80-0000-4000-a000-000000000004
      version: -1
      name: Look for existing Command Zero actions
      description: |-
        Reports whether anyone has already acted on this investigation. The
        Command Zero API gives a remediation no investigation reference, so this
        correlates on the marker that cmdzero-remediation-create writes into the
        justification — actions raised directly in the console will not be
        found.
      script: CommandZero|||cmdzero-remediation-list
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "5"
    scriptarguments:
      investigation_id:
        complex:
          root: CommandZero.Investigation
          accessor: id
    reputationcalc: 0
    separatecontext: false
    # Context for the note, not the point of the playbook. A lookup failure
    # must not cost the analyst the verdict.
    continueonerror: true
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 545
        }
      }
    note: false
    timertriggers: []
