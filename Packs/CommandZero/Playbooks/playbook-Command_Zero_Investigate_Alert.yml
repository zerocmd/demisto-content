    task:
      id: 6f1a0c80-0000-4000-a000-000000000005
      version: -1
      name: Post the investigation summary
      description: |-
        Writes the verdict and findings to the War Room, stating explicitly that
        this playbook requested no response action, and listing any Command Zero
        actions already recorded against the investigation.
      script: CommandZero|||cmdzero-investigation-note
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "3"
    scriptarguments:
      investigation_id:
        complex:
          root: CommandZero.Investigation
          accessor: id
      response_disposition:
        simple: investigate-only
      related_remediations:
        complex:
          root: CommandZero.Remediation
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
