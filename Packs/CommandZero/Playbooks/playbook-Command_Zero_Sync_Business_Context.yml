inputs:
  - key: UploadName
    value: {}
    required: true
    description: |-
      A stable, descriptive name identifying the source system and data type,
      such as "HR User Directory" or "ServiceNow CMDB Servers". This name is the
      sync key: keep it the same across runs so the upload is replaced rather
      than duplicated. Avoid apostrophes, which break the lookup filter.
    playbookInputQuery: null
  - key: Records
    value: {}
    required: true
    description: |-
      JSON array of objects holding your context data. Each object should
      contain at least one field that maps to a subject type in the schema.
      Supply the complete set every run — a replace does not merge.
    playbookInputQuery: null
  - key: Schema
    value: {}
    required: true
    description: |-
      JSON array of annotations mapping paths in your records to Command Zero
      catalog types. At least two are required, and at least one must map to a
      subject type such as EMAIL_ADDRESS or HOST_NAME. For example
      [{"path":"email","type":"EMAIL_ADDRESS"},{"path":"department","type":"TEXT"}].
    playbookInputQuery: null
  - key: Description
    value: {}
    required: false
    description: Optional description providing additional context.
    playbookInputQuery: null
  - key: WaitForProcessing
    value:
      simple: "true"
    required: false
    description: |-
      Whether to wait for the upload to finish processing before completing.
      Context is not applied to investigations until it is ready.
    playbookInputQuery: null
outputs:
  - contextPath: CommandZero.BusinessContextUpload.id
    description: Upload unique identifier.
    type: string
  - contextPath: CommandZero.BusinessContextUpload.name
    description: Human-readable name for this upload.
    type: string
  - contextPath: CommandZero.BusinessContextUpload.status
    description: Processing status. One of processing, ready, or failed.
    type: string
  - contextPath: CommandZero.BusinessContextUpload.recordCount
    description: Number of records in this upload.
    type: number
  - contextPath: CommandZero.BusinessContextUpload.subjectTypes
    description: Subject types identified in this upload.
    type: unknown
tests:
