id: Command Zero - Sync Business Context
version: -1
name: Command Zero - Sync Business Context
description: |-
  Pushes business context from this SOAR into Command Zero, so investigations
  are enriched with what you know about your users, hosts and applications that
  Command Zero cannot discover by querying your systems.

  The sync is idempotent. It looks for an existing upload with the same name and
  replaces it if found, creating one only the first time. Run it on a schedule
  and you get one upload that stays current, not a new upload every run.

  Replacing is a full replacement of the records, never a merge, so supply the
  complete set each time. The previous version stays active for new
  investigations until the replacement finishes processing.

  HOW TO USE THIS PLAYBOOK

  1. Produce your context records as a JSON array and pass them in as the
     Records input. They can come from anywhere — an XSOAR list, a CMDB
     integration, an HR export.
  2. Describe them with the Schema input: a JSON array of path/type
     annotations. At least two are required, and at least one must map to a
     subject type such as EMAIL_ADDRESS or HOST_NAME.
  3. Give the upload a stable UploadName. That name is the sync key, so keep it
     the same across runs and avoid apostrophes in it.
  4. Schedule the playbook as a job for a recurring sync.

  Watchlists and Exclusions are not yet available in the Command Zero API. When
  they are, they belong alongside this playbook.
