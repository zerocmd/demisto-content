        complex:
          root: CommandZero.Remediation
          accessor: governanceReason
      rollback_template_id:
        complex:
          root: CommandZero.Remediation
          accessor: undoTemplateId
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
