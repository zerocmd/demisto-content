id: Command Zero - Investigate and Respond
version: -1
name: Command Zero - Investigate and Respond
description: |-
  Submits an alert to Command Zero for automated investigation, waits for the
  verdict, and when the verdict matches the configured label, executes a native
  Command Zero response action. The verdict and the outcome of the response
  action are written to the War Room as a single note.

  Response action governance is enforced by Command Zero, not by this playbook.
  An action that is blocked or that conflicts with another action is reported in
  the note with the reason; the playbook does not fail and does not retry.

  No incident, alert, or investigation fields are modified.
starttaskid: "0"
tasks:
  "0":
    id: "0"
    taskid: 7a2b1d90-0000-4000-a000-000000000000
    type: start
    task:
      id: 7a2b1d90-0000-4000-a000-000000000000
      version: -1
      name: ""
      iscommand: false
      brand: ""
      description: ''
    nexttasks:
      '#none#':
        - "1"
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 50
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "1":
    id: "1"
    taskid: 7a2b1d90-0000-4000-a000-000000000001
    type: regular
    task:
      id: 7a2b1d90-0000-4000-a000-000000000001
      version: -1
      name: Submit alert for investigation
      description: |-
        Creates a Command Zero investigation from the supplied alert data.
      script: CommandZero|||cmdzero-investigation-create
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "2"
    scriptarguments:
      alert_data:
        complex:
          root: inputs.AlertData
      alert_schema:
        complex:
          root: inputs.AlertSchema
      alert_type:
        complex:
          root: inputs.AlertType
      description:
        complex:
          root: inputs.Description
      template_id:
        complex:
          root: inputs.TemplateId
      leads:
        complex:
          root: inputs.Leads
      title:
        complex:
          root: inputs.Title
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 195
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "2":
    id: "2"
    taskid: 7a2b1d90-0000-4000-a000-000000000002
    type: regular
    task:
      id: 7a2b1d90-0000-4000-a000-000000000002
      version: -1
      name: Wait for verdict
      description: |-
        Polls Command Zero until the investigation reaches a verdict. The note
        is suppressed here so that a single combined note can be posted later,
        covering both the verdict and the response action.
      script: CommandZero|||cmdzero-investigation-results
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "3"
    scriptarguments:
      investigation_id:
        complex:
          root: CommandZero.Investigation
          accessor: id
      interval_in_seconds:
        complex:
          root: inputs.PollingInterval
      timeout_in_seconds:
        complex:
          root: inputs.PollingTimeout
      post_note:
        simple: "false"
    reputationcalc: 0
    separatecontext: false
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 370
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "3":
    id: "3"
    taskid: 7a2b1d90-0000-4000-a000-000000000003
    type: condition
    task:
      id: 7a2b1d90-0000-4000-a000-000000000003
      version: -1
      name: Does the verdict qualify for response?
      description: |-
        Checks the verdict labels against the ActionableVerdict input. Command
        Zero returns verdict as an array of labels, so this is a membership
        test, not an equality test.
      type: condition
      iscommand: false
      brand: ""
    nexttasks:
      '#default#':
        - "6"
      "Respond":
        - "11"
    separatecontext: false
    conditions:
      - label: "Respond"
        condition:
          - - operator: containsGeneral
              left:
                value:
                  complex:
                    root: CommandZero.Investigation
                    accessor: verdict
                iscontext: true
              right:
                value:
                  complex:
                    root: inputs.ActionableVerdict
                iscontext: true
              ignorecase: true
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 450,
          "y": 545
        }
      }
    note: false
    timertriggers: []
    ignoreworker: false
    skipunavailable: false
    quietmode: 0
    isoversize: false
    isautoswitchedtoquietmode: false
  "4":
    id: "4"
    taskid: 7a2b1d90-0000-4000-a000-000000000004
    type: regular
    task:
      id: 7a2b1d90-0000-4000-a000-000000000004
      version: -1
      name: Execute native response action
      description: |-
        Requests the response action. Command Zero enforces governance
        server-side: the action may be executed, blocked by policy, or refused
        as conflicting. All three outcomes are returned as results rather than
        errors, so the playbook continues to the note in every case.
      script: CommandZero|||cmdzero-remediation-create
      type: regular
      iscommand: true
      brand: CommandZero
    nexttasks:
      '#none#':
        - "9"
    scriptarguments:
      template_id:
        complex:
          root: inputs.RemediationTemplateId
      subject_type:
        complex:
          root: inputs.RemediationSubjectType
      subject_value:
        complex:
          root: inputs.RemediationSubjectValue
      justification:
        complex:
          root: inputs.RemediationJustification
    reputationcalc: 0
    separatecontext: false
    # A blocked or conflicting action already returns a result rather than an
    # error. This covers the harder failures — an unreachable tenant, a bad
    # template — so the verdict note is still posted and the analyst is not
    # left with a silent playbook.
    continueonerror: true
    continueonerrortype: ""
    view: |-
      {
        "position": {
          "x": 240,
          "y": 895
