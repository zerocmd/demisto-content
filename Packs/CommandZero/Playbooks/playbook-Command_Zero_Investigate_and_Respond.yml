inputs:
  - key: AlertData
    value: {}
    required: false
    description: |-
      The Command Zero alert: a JSON object holding the detection you want
      investigated. This is not the Cortex case the playbook is running on —
      nothing is read from it automatically, so map in whatever you want
      submitted.

      Where the case came from a fetching integration, the incident's rawJSON
      usually holds the original untouched payload, which is the case where
      AlertSchema can name a catalog type. Anything Cortex has mapped, or that
      a playbook assembled, is reshaped and needs annotations instead.

      Required unless TemplateId is supplied.
    playbookInputQuery: null
  - key: AlertSchema
    value: {}
    required: false
    description: |-
      Either a JSON array of path/type annotations describing where the values
      are in your own data, or a known catalog type string.

      Use a catalog type only when the payload still matches that entry's
      expected shape. If the alert has been reshaped on its way into Cortex,
      supply annotations instead.
    playbookInputQuery: null
  - key: AlertType
    value: {}
    required: false
    description: |-
      The kind of alert this is, for example EmailMalwareDetected. Required
      when AlertSchema is omitted, and when AlertSchema is a JSON array of
      annotations. Must NOT be set when AlertSchema is a catalog type string.
    playbookInputQuery: null
  - key: Description
    value: {}
    required: false
    description: |-
      Detailed description of the investigation. Required when submitting
      AlertType and AlertData without an AlertSchema.
    playbookInputQuery: null
  - key: TemplateId
    value: {}
    required: false
    description: |-
      Investigation template ID, for template-based investigations. Use instead
      of AlertData and AlertSchema.
    playbookInputQuery: null
  - key: Leads
    value: {}
    required: false
    description: JSON array of lead objects when using TemplateId.
    playbookInputQuery: null
  - key: Title
    value: {}
    required: false
    description: Optional title override for the investigation.
    playbookInputQuery: null
  - key: ActionableVerdict
    value:
      simple: Malicious
    required: false
    description: |-
      The verdict label that qualifies the investigation for a response action.
      Command Zero returns verdict as an array of labels; the response runs when
      this value appears among them.
    playbookInputQuery: null
  - key: RemediationTemplateId
    value: {}
    required: false
    description: |-
      Remediation template to execute on a qualifying verdict. Use
      cmdzero-remediation-template-list to find available templates. When empty,
      no response action is attempted and the playbook posts the verdict only.
    playbookInputQuery: null
  - key: RemediationSubjectType
    value: {}
    required: false
    description: |-
      Subject type for the response action, matching the template's subjectType.
      For example MICROSOFT_ENTRA_USER_PRINCIPAL_NAME.
    playbookInputQuery: null
  - key: RemediationSubjectValue
    value: {}
    required: false
    description: |-
      The target of the response action, such as a user principal name or a
      device ID.
    playbookInputQuery: null
  - key: RemediationJustification
    value:
      simple: Automated response to a qualifying Command Zero verdict.
    required: false
    description: |-
      Justification recorded in the Command Zero audit trail for the response
      action.
    playbookInputQuery: null
  - key: PollingInterval
    value:
      simple: "60"
    required: false
    description: Seconds between polls while waiting for the verdict.
    playbookInputQuery: null
  - key: PollingTimeout
    value:
      simple: "3600"
    required: false
    description: Seconds to wait for a verdict before giving up.
    playbookInputQuery: null
outputs:
  - contextPath: CommandZero.Investigation.id
    description: Investigation unique identifier.
    type: string
  - contextPath: CommandZero.Investigation.verdict
    description: Verdict labels assigned by Command Zero.
    type: unknown
  - contextPath: CommandZero.Investigation.severity
    description: Investigation severity.
    type: string
  - contextPath: CommandZero.Investigation.confidenceLevel
    description: Confidence in the investigation findings.
    type: string
  - contextPath: CommandZero.Investigation.consoleUrl
    description: Direct link to the investigation in the Command Zero console.
    type: string
  - contextPath: CommandZero.Remediation.id
    description: Remediation unique identifier, when a response action was attempted.
    type: string
  - contextPath: CommandZero.Remediation.governanceOutcome
    description: Whether the response action was executed, blocked, or conflicted.
    type: string
  - contextPath: CommandZero.Remediation.undoTemplateId
    description: Template that reverses the action, when it is reversible.
    type: string
tests:
  - Command Zero - Test
fromversion: 6.10.0
marketplaces:
  - xsoar
